name: Sfera VPN Bot

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install aiogram

      - name: Check bot code
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python -m py_compile bot.py
